# foonmail configuration.
# Copy to ~/.config/foonmail/config.toml (or set FOONMAIL_CONFIG).
#
# Passwords are not stored here but in the Secret Service keyring. Once the
# accounts are set up, run
#
#   foonmailctl passwords
#
# to type the missing ones; each is checked by logging in before it is stored.
#
# Unknown settings are reported as errors, so typos don't go unnoticed.

# Where the mail cache lives. Default: ~/.cache/foonmail
# cache_dir = "~/.cache/foonmail"

# Where what exists only locally (the outbox) lives. Default: ~/.local/share/foonmail
# data_dir = "~/.local/share/foonmail"

# How long sent mail waits, so it can be taken back, before it goes.
# Between 1s and 5m. Default: 5s
# undo_delay = "5s"

[[account]]
name = "home"                        # short id: a-z, 0-9, _ and -
email = "you@example.com"            # primary address
display_name = "Your Name"
# Other addresses that are you: a reply goes out from the one the message
# was sent to, they're left out of reply-all, mail from them doesn't notify,
# and they aren't suggested as contacts. "@domain" covers a whole domain,
# such as one whose mail is all forwarded here.
aliases = ["postmaster@example.com", "@example.net"]

# Added under a "-- " line to new messages, replies and forwards.
# signature = """
# Your Name
# example.com
# """

# Copy sent mail to the Sent folder. Set to false for Gmail, which does it itself.
# append_sent = true

# Show sender and subject in new-mail notifications.
# notify_details = true

# Where mail filters (Shift+F) are kept: a ManageSieve server, logged in to
# with the IMAP username and password over STARTTLS. Default: the IMAP host
# on port 4190; Gmail has none. "off" turns filters off.
# managesieve = "mail.example.com:4190"

[account.imap]
host = "mail.example.com"
username = "you"
# security = "tls"        # "tls" (implicit TLS) or "starttls"
# port = 993              # default: 993 for tls, 143 for starttls

[account.smtp]
# host and username default to the IMAP ones.
# host = "mail.example.com"
# username = "you"
# security = "tls"
# port = 465              # default: 465 for tls, 587 for starttls

[account.folders]
# INBOX is always watched live and is the only folder that alerts.
# Watched folders are polled in the background; everything else syncs
# when you open it. "@sent", "@drafts", "@trash", "@junk" and "@archive"
# refer to folders by their special-use flag instead of their name.
# watched = ["@sent"]
# poll_interval = "5m"

# A Gmail account. Gmail needs an app password (with 2-Step Verification
# on: myaccount.google.com/apppasswords); foonmailctl passwords asks for it
# once, as SMTP uses the IMAP entry. Sent mail isn't copied to Sent Mail (Gmail
# does that itself), and archiving moves mail to All Mail.
#
# [[account]]
# name = "gmail"
# email = "you@gmail.com"
# display_name = "Your Name"
#
# [account.imap]
# host = "imap.gmail.com"
# username = "you@gmail.com"
#
# [account.smtp]
# host = "smtp.gmail.com"
